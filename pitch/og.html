<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>og</title>
<style>
@font-face { font-family: 'Public Sans'; font-weight: 400 800; src: url('../public/fonts/public-sans-latin-normal.woff2') format('woff2'); }
html, body { margin: 0; }
body { width: 1200px; height: 630px; background: #ffffff; font-family: 'Public Sans', sans-serif; color: #0f1729; display: flex; flex-direction: column; justify-content: center; padding: 0 80px; box-sizing: border-box; font-variant-numeric: tabular-nums; }
.brand { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 26px; margin-bottom: 26px; }
.mark { width: 30px; height: 30px; border: 3px solid #0f1729; border-radius: 7px; position: relative; }
.mark::after { content: ''; position: absolute; left: 8px; top: 2px; width: 8px; height: 15px; border: solid #067647; border-width: 0 4px 4px 0; transform: rotate(45deg); }
h1 { font-size: 72px; line-height: 1; letter-spacing: -0.04em; margin: 0 0 34px; font-weight: 800; }
.tiles { display: flex; gap: 18px; }
.tile { flex: 1; border-radius: 20px; padding: 20px 26px; background: #f5f7fa; position: relative; }
.tile span { display: block; font-size: 18px; color: #8a94a6; font-weight: 600; }
.tile b { font-size: 58px; letter-spacing: -0.035em; font-weight: 800; }
.ok b { color: #067647; }
.sus { background: #fffaeb; border: 2px solid #a15c07; }
.sus i { display: block; font-style: normal; font-size: 19px; color: #a15c07; font-weight: 700; }
.stamp { position: absolute; right: 22px; top: 16px; font-size: 20px !important; transform: rotate(-10deg); border: 4px solid #c0281b; color: #c0281b; border-radius: 10px; padding: 2px 14px; font-size: 26px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; }
</style></head>
<body>
  <div class="brand"><span class="mark"></span>Ledger Fix Lab</div>
  <h1>The books balance.<br>One line is lying.</h1>
  <div class="tiles">
    <div class="tile ok"><span>Bank reconciliation</span><b>$0.00</b></div>
    <div class="tile sus"><span>Net profit</span><b>$10,410.76</b><i>Overstated by $5,000</i><div class="stamp">Wrong</div></div>
  </div>
</body></html>
